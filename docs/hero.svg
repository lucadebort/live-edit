<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">live-edit</title>
  <desc id="desc">A wireframe web page in edit mode: one paragraph is outlined and being typed into, with the Edit toolbar in the corner. Next to it, the source file shows the same change as a one-line diff.</desc>
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1A1814" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1A1814" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#3B6CF6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="680" rx="24" fill="#F3F2EE"/>

  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="48" y="56" width="748" height="568" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="48.5" y="56.5" width="747" height="567" rx="15.5" fill="none" stroke="#E4E1DA"/>
  <circle cx="76" cy="80" r="6" fill="#E4E1DA"/>
  <circle cx="96" cy="80" r="6" fill="#E4E1DA"/>
  <circle cx="116" cy="80" r="6" fill="#E4E1DA"/>
  <rect x="297" y="66" width="250" height="28" rx="14" fill="#F3F2EE"/>
  <text x="422" y="85" text-anchor="middle" class="sans" font-size="13" fill="#8C8880">localhost:3000/landing/</text>
  <line x1="48" y1="104.5" x2="796" y2="104.5" stroke="#ECEAE4"/>

  <!-- nav -->
  <rect x="96" y="132" width="84" height="16" rx="4" fill="#26262B"/>
  <rect x="452" y="136" width="44" height="8" rx="4" fill="#DAD7CF"/>
  <rect x="512" y="136" width="44" height="8" rx="4" fill="#DAD7CF"/>
  <rect x="572" y="136" width="44" height="8" rx="4" fill="#DAD7CF"/>
  <rect x="644" y="126" width="104" height="28" rx="6" fill="#26262B"/>

  <!-- hero -->
  <rect x="96" y="190" width="8" height="8" rx="2" fill="#3B6CF6" opacity="0.55"/>
  <rect x="112" y="190" width="176" height="8" rx="4" fill="#DAD7CF"/>
  <rect x="96" y="214" width="472" height="34" rx="8" fill="#26262B"/>
  <rect x="96" y="258" width="364" height="34" rx="8" fill="#26262B"/>

  <!-- the element being edited -->
  <rect id="edit-box" x="86" y="320" width="284" height="42" rx="6" fill="#3B6CF6" fill-opacity="0.05" stroke="#3B6CF6" stroke-width="1.5"/>
  <rect x="86" y="300" width="56" height="18" rx="4" fill="#3B6CF6"/>
  <text x="114" y="313" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#FFFFFF">Editing</text>
  <text id="edit-text" x="96" y="348" class="sans" font-size="22" fill="#18181B">Change the words yourself.</text>
  <rect id="caret" x="358" y="329" width="2" height="25" rx="1" fill="#3B6CF6"/>

  <!-- rest of the copy, untouched -->
  <rect x="96" y="386" width="404" height="10" rx="5" fill="#E7E4DD"/>
  <rect x="96" y="406" width="372" height="10" rx="5" fill="#E7E4DD"/>
  <rect x="96" y="426" width="268" height="10" rx="5" fill="#E7E4DD"/>
  <rect x="580" y="380" width="168" height="36" rx="6" fill="#26262B"/>
  <rect x="580.75" y="424.75" width="166.5" height="34.5" rx="5.25" fill="none" stroke="#DAD7CF" stroke-width="1.5"/>

  <!-- image block -->
  <rect x="96" y="476" width="652" height="116" rx="10" fill="#F0EEE9"/>
  <path d="M398 556 L418 530 L432 546 L444 534 L462 556 Z" fill="#DAD7CF"/>
  <circle cx="452" cy="516" r="6" fill="#DAD7CF"/>

  <!-- live-edit toolbar -->
  <g filter="url(#shadow)">
    <rect x="64" y="568" width="160" height="36" rx="18" fill="#18181B"/>
  </g>
  <rect x="70" y="574" width="76" height="24" rx="12" fill="#3B6CF6"/>
  <text x="108" y="590" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#FFFFFF">Edit E</text>
  <circle cx="161" cy="586" r="3.5" fill="#3DDC84"/>
  <text x="171" y="590" class="sans" font-size="12" fill="#B4B1AA">Saved</text>

  <!-- connector -->
  <path d="M370 341 H 804" fill="none" stroke="#3B6CF6" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="370" cy="341" r="3.5" fill="#3B6CF6"/>

  <!-- source file -->
  <g transform="translate(-12 30)">
  <g filter="url(#shadow)">
    <rect x="828" y="168" width="336" height="222" rx="14" fill="#18181B"/>
  </g>
  <text x="852" y="198" class="mono" font-size="12" fill="#A1A1AA">landing/index.html</text>
  <text x="1110" y="198" text-anchor="end" class="mono" font-size="12" fill="#4ADE80">+1</text>
  <text x="1140" y="198" text-anchor="end" class="mono" font-size="12" fill="#F87171">−1</text>
  <line x1="828" y1="214.5" x2="1164" y2="214.5" stroke="#2A2A30"/>

  <g class="mono" font-size="12">
    <text x="852" y="244" fill="#52525B">38</text>
    <text x="884" y="244" fill="#71717A">&lt;section class="hero"&gt;</text>
    <text x="852" y="268" fill="#52525B">39</text>
    <text x="884" y="268" fill="#71717A" xml:space="preserve">  &lt;h1&gt;…&lt;/h1&gt;</text>

    <rect x="828" y="277" width="336" height="23" fill="#F87171" fill-opacity="0.12"/>
    <text x="852" y="292" fill="#F87171">−</text>
    <text x="884" y="292" fill="#FCA5A5" xml:space="preserve">  &lt;p&gt;Ask a developer.&lt;/p&gt;</text>

    <rect x="828" y="300" width="336" height="23" fill="#4ADE80" fill-opacity="0.12"/>
    <text x="852" y="316" fill="#4ADE80">+</text>
    <text x="884" y="316" fill="#86EFAC" xml:space="preserve">  &lt;p&gt;Change the words yourself.&lt;/p&gt;</text>

    <text x="852" y="340" fill="#52525B">41</text>
    <text x="884" y="340" fill="#71717A" xml:space="preserve">  &lt;a class="btn"&gt;…&lt;/a&gt;</text>
    <text x="852" y="364" fill="#52525B">42</text>
    <text x="884" y="364" fill="#71717A">&lt;/section&gt;</text>
  </g>

  <text x="828" y="428" class="sans" font-size="14" fill="#56534D">Enter saves straight to the source file.</text>
  <text x="828" y="450" class="sans" font-size="14" fill="#8C8880">Everything else stays byte for byte.</text>
  </g>
</svg>
